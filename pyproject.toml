[project]
name = "footy"
version = "0.1.0"
description = "Football match, goals and player prediction system for the Big 5 European leagues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Added in later stages; listed here so the plan is visible.
model = ["scikit-learn>=1.4", "lightgbm>=4.3", "scipy>=1.12", "joblib>=1.3", "matplotlib>=3.8", "tabulate>=0.9"]
understat = ["soccerdata>=2026.43"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
bot = ["python-telegram-bot[job-queue]>=21,<23", "pydantic>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "pandas-stubs", "types-requests", "types-PyYAML"]

[project.scripts]
footy = "footy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
